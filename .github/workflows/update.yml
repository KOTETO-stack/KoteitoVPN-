name: Обновление VPN-подписки

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей (если есть requirements.txt)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Этот шаг покажет вам, как называется ваш скрипт
      - name: Показать файлы в репозитории
        run: ls -la

      - name: Запуск генератора
        run: |
          # ВАЖНО: Замените main.py на имя вашего файла из шага выше!
          python main.py

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          git commit -m "Автоматическое обновление подписки $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push